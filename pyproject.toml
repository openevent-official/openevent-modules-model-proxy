[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openevent-model-proxy"
version = "0.1.0"
description = "OpenEvent llm.v1 model proxy worker and protocol SDK"
requires-python = ">=3.10"
dependencies = [
    "openevent-sdk>=0.8.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["packaging"]

[project.scripts]
model-proxy = "openevent.model_proxy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openevent"]
